  repo: https://charts.jetstack.io
  chart: cert-manager
  version: 1.20.3
  # defaults: defaults/cert-manager.yaml



# https://github.com/cloudnative-pg/charts/releases
# https://github.com/cloudnative-pg/charts/blob/main/charts/cloudnative-pg/values.yaml
cnpg-operator:
  repo: https://cloudnative-pg.github.io/charts
  chart: cloudnative-pg
  version: 0.28.0
  # namespace: cnpg-system
  argocd:
    syncOptions:
      - CreateNamespace=true
      - Replace=true
      - PruneLast=true



# https://github.com/keycloak/keycloak-k8s-resources.git
keycloak-operator:
  name: keycloak-operator
  repo: https://github.com/keycloak/keycloak-k8s-resources.git
  path: kubernetes
  version: 26.6.3
  include: '{keycloak*.yml,kubernetes.yml}' # CRDs + operator




---



#---------- Skware Config ----------#

skware:
  package: skware.app
  labels: {}
  annotations: {}
  debug: false
  # debug: true

  # Prepend the Skware app release name to each App name
  # Usefull when you intend to deploy multiple instances
  #   of the same apps with the same name
  use-release-name: false

  # env: <env-name> # used as suffix for every app manifest/helm deployment (none by default (prod))
  # profiles:
  #   - min
  #   - ha
  #   - 1db

  # Apps to install as a list of IDs
  apps: []

  # DO NOT OVERRIDE, internal use
  _argocd_sync:
    create_ns: CreateNamespace
    out_of_sync: ApplyOutOfSyncOnly
    server_side: ServerSideApply
    fail_shared: FailOnSharedResource
    prune_last: PruneLast
    replace: Replace



#---------- App defaults ----------#

app-defaults:
  # name: ArgoCD app name, default: <appID>
  # Namespace: set to null to omit (cluster-wide resources) ; otherwise, default: <name>
  # namespace:

  # Labels/Annotations: mapping of keys/values ; Label keys will be prefixed with "skware.package" => will generate for each label:
  #   <skware.package>/<key>: <value>
  labels: {}
  annotations: {}

  # Main source repository:
  # repo: # REQUIRED
  # REQUIRED: chart OR path
  # chart: 
  # path: 
  # version: 
  # include|exclude: 
  # # Release name override ; default is the ArgoCD app's name
  # releaseName: # default: <$.Release.Name>-<name>

  # the full ArgoCD sources spec for custom ArgoCD apps
  # https://argo-cd.readthedocs.io/en/latest/user-guide/multiple_sources/#helm-value-files-from-external-git-repository
  # sourcesSpec:

  # User values for the chart
  # values:
  #   repo: https://git.example.com/org/values.git
  #   # version: 
  #   # list of user value files
  #   files:
  #     - <values-file-path-relative-to-repo-root>
  # valuesObject: # Set values as yaml object directly in the ArgoCD App manifest

  # [opt] Additional/custom static manifests (ConfigMaps, Custom Resources, kustomizations...)
  #   Meant to be a quick way to inject custom manifest (plain or using kustomize) to the ArgoCD application,
  #     NOT to install a second Helm chart with a releaseName and values (which would optionally be hosted on
  #     yet another repository). You can still use this to deploy a Helm chart using Kustomize though!
  #       cf. https://kubectl.docs.kubernetes.io/references/kustomize/builtins/#_helmchartinflationgenerator_
  #     Otherwise, you can use the full "sourcesSpec" for any complex/specific needs.
  #   Don't forget to specify an ArgoCD sync-wave value in those manifests to control whether to apply them
  #     before or after those from the main repo/chart (before: sync-wave < 0, after: sync-wave > 0)
  # custom:
  #   repo: 
  #   # version: [opt]
  #   # path: [opt]

  # ArgoCD application parameters defaults
  # https://kostis-argo-cd.readthedocs.io/en/refresh-docs/syncing/waves/
  # https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/
  argocd:
    project: default
    cluster: https://kubernetes.default.svc
    # Managed namespace: labels (Istio ambient, podSecurity, ...) -> only when CreateNamespace=true
    nsLabels: {}
    # Managed namespace: annotations () -> only when CreateNamespace=true
    nsAnnotations: {}
    # Full syncPolicy override:
    # syncPolicy:
    # Custom syncOptions flags (overridable per-option)
    #   Usage:
    #     - use the original camel-like variables
    #         sync:
    #           CreateNamespace: true
    #           ApplyOutOfSyncOnly: true
    #     - use shorthands, mapped to te original in skware._argocd_sync
    #         sync:
    #           create_ns: true
    #           out_of_sync: true
    #   Default: CreateNamespace=true, ApplyOutOfSyncOnly=true
    sync:
      create_ns: true
      out_of_sync: true
      # server_side: false
      # fail_shared: false
      # replace: false
      # prune_last: false
    # Full syncOptions list (takes precedence over "argocd.sync")
    # syncOptions:
    #   - CreateNamespace=true
    #   - ApplyOutOfSyncOnly=true
    #   - ServerSideApply=true
    #   - FailOnSharedResource=true
    #   - PruneLast=true
    #   - Replace=true
    automated:
      selfHeal: true
      prune: true

